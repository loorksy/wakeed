# Nginx site for Wakeed remittance import — wakeed.lork.cloud
# Upstream: PM2 process on 127.0.0.1:3030

upstream wakeed_import_upstream {
    server 127.0.0.1:3030;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name wakeed.lork.cloud www.wakeed.lork.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://wakeed.lork.cloud$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wakeed.lork.cloud www.wakeed.lork.cloud;

    # Managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/wakeed.lork.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wakeed.lork.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://wakeed_import_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
